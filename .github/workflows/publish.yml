name: Publish

# Disabled until a registry token exists. Uncomment the tag trigger and
# the NODE_AUTH_TOKEN line, and remove `if: false` on the publish step.
on:
  workflow_dispatch:
  # push:
  #   tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run validate
      - run: npm run check:changelog
      - name: Publish workspaces
        if: false
        run: npm publish --workspaces --access public
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
